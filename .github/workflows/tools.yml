# ⛔ THIS REPOSITORY HAD NO CI AT ALL UNTIL THIS FILE.
#
# Measured 2026-08-20: `gh run list` returned nothing — zero workflow runs, ever. Every
# "all checks green" on every pull request has been **CodeRabbit + Socket Security**, a
# review bot and a dependency scanner. Neither runs a test. So 23 instruments and 19 test
# suites had never executed in CI once, and every PR merged on a green board was merged
# with zero test execution, including six of mine on the day this was written.
#
# ★ That is the defect this repository's own tools were built to find, in this repository:
#   #1267 a convention naming an enforcement path that does not exist
#   #1268 the cluster-spec guard, in-tree and wired into no workflow
#   #1269 "a gate that never refuses looks identical to one that does not exist"
#
# ⚠ THE SPLIT BELOW IS LOAD-BEARING, NOT TIDINESS. Some suites pass on a developer machine
# and FAIL on a runner, because they assert on output that only exists when a real corpus
# is present — "names its scope", "prints project dir count". The tools are right; those
# tests conflated *the tool works* with *this machine has a fleet*. Gating on all of them
# would ship a born-red guard: exactly the finding in #1268.
#
# ⛔ AND THE FIRST VERSION OF THIS FILE GOT THE SPLIT WRONG, MEASURED BY ITS OWN FIRST RUN.
# It said "7 of 19 fail on a runner", derived from re-running under an empty HOME. Run
# 32345860216 reported **6**: `test_grant_check` PASSED. Its local failure was
# `git fetch origin` finding no credentials — and a runner with actions/checkout HAS them.
#
# ⇒ An empty HOME is a proxy for a runner, and it conflates TWO causes: no fleet corpus
# and no network. One of the seven was network. **A real number attached to the wrong
# population**, the defect this repository has catalogued all week, committed in the
# classification of the fix for it. The counts below are now from the CI run, not the proxy.
#
# ★ THREE OF THE SEVEN ARE NOW GATED, by giving them a fixture instead of the developer's
# corpus (`tools/test_corpus_fixture.py`). Their assertions were about OUTPUT SHAPE all
# along; reading the live corpus meant they passed according to what this machine happened
# to hold, which is a green tick over "a working set is not a sample".

name: tools

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hermetic:
    name: hermetic suites (gating)
    runs-on: ubuntu-latest
    steps:
      # ⛔ fetch-depth: 0 IS LOAD-BEARING, not a convenience. The default is a DEPTH-1 clone, and
      # `scripts/check-tools-index.py` asks a history question — how many distinct commits ADDED
      # the files in this directory — to separate a directory that accreted from one imported
      # wholesale out of another estate's scratch dir. At depth 1 that query returns ONE for
      # EVERY directory. Measured 2026-08-20 by reproducing a `--depth 1` clone of this branch:
      # ALL 35 top-level instruments — the fleet's own tools — were reported UNCLAIMED and the
      # run exited 2. ⚠ `git log` did not fail; it answered confidently over a truncated
      # population, which is why the tool's returncode guard never fired.
      # ⇒ The tool now refuses the question when the clone is shallow (NOT CHECKED, never
      # guessed). This line is the other half: refusing is safe, but a leg that can never run in
      # CI is a leg that only ever runs on someone's laptop.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⇒ GLOBBED, and each suite DECLARES its own dependency. The literal list this
      # replaces was the single largest source of merge conflicts in this repository:
      # measured 2026-08-20 over the open PRs, 11 of 21 pairs conflicted and
      # `.github/workflows/tools.yml` caused 11 of 11 — every PR that adds a tool edited
      # the same two lines. That is "enforce over the POPULATION, not a literal list",
      # which this repo already had as a rule and not as a practice.
      #
      # ⛔ The old comment's objection was real and is answered, not ignored: a glob would
      # silently absorb a machine-dependent suite and red the gate for a non-defect. So a
      # suite that needs a fleet, a network or a live registry says so IN ITS OWN FILE:
      #     # SUITE-DEPENDS: <the specific reason>
      # A suite declaring nothing is HERMETIC AND GATING. That default is fail-closed in
      # the right direction — the old arrangement's cost was a new suite silently UNGATED
      # until someone remembered to list it, and silence is the worse failure. A
      # mis-defaulted suite fails loudly once and is fixed by one line in the author's own
      # file, touching nothing anyone else edits.
      # ⛔ THE LOOP THAT USED TO BE INLINE HERE HAD TWO OUTCOMES, AND THE SUBJECT HAS THREE.
      # `python3 "$f" || fail=1` folds exit 2 into FAILED. Exit 2 is this repository's "I
      # established nothing" (#58) — and also what the runtime emits for a file it cannot
      # open and what argparse emits for an argument it will not accept. Reporting a
      # REFUSAL as a DEFECT is fail-closed-and-wrong, the pair nobody challenges because the
      # gate erred toward caution, and it sends a reader to fix a test that was never broken.
      #
      # ⇒ MOVED OUT OF THIS FILE ON PURPOSE, and not only for length. A gate whose logic
      # lives in YAML has no way to be exercised except by merging it: there is no local
      # run, no control, and the first honest test is production. `scripts/gate-suites.sh`
      # has a `--self-test` that plants suites exiting 0, 1 and 2 and asserts the
      # classification — including the known-negative (an exit-1 suite must read FAILED,
      # never UNESTABLISHED) and the stated limit, demonstrated rather than claimed.
      #
      # ⚠ It also shrinks this step to one line, which matters here specifically: this
      # file's own header records that it caused 11 of 11 conflicting open-PR pairs.
      - name: hermetic test suites
        run: ./scripts/exit-code-gate.sh tools 'test_*.py' 'hermetic suite'

      # ⛔ THE SAME COLLAPSED PAIR, IN THE STEP THAT ENFORCES EVERYTHING ELSE. This ran
      # `python3 "$s"` under `set -euo pipefail`, where exit 1 and exit 2 fail the job
      # IDENTICALLY. So a checker that FOUND SOMETHING and a checker that REFUSED TO SPEAK
      # produce the same red, and a reader goes looking for a defect that may not exist —
      # or, worse, dismisses a genuine finding as "that one always errors."
      #
      # ⚠ IT STILL BLOCKS ON BOTH. This is not a relaxation and must not become one: no
      # `continue-on-error`, no `|| true`, and nothing moved out of the gating job. The
      # header of this file already quotes the reason — "a gate that never refuses looks
      # identical to one that does not exist." The change is what the red SAYS, not whether
      # it is red.
      #
      #     0  the check ran and agreed with the world
      #     1  FINDINGS      — it ran, concluded, and reported something. Go read it.
      #     2  UNESTABLISHED — it refused. ⛔ No claim about the repository follows.
      - name: repo scripts
        run: ./scripts/exit-code-gate.sh scripts '*.py' 'repo check'

      # ⛔ THE STEP ABOVE ASKS "DID THE CHECK PASS". THIS ONE ASKS "DOES IT STILL WORK".
      # Nothing asked the second until now (#321). `tools/test_*.py` covers the instruments in
      # tools/; `scripts/` has NO test files — its four checkers carry their controls inside
      # themselves as `--self-test`, and that surface was the only one CI never invoked. So four
      # checkers GATED every merge while the controls proving they can still produce a verdict
      # had never run in CI once.
      #
      # ⚠ AND RUNNING `--self-test` IS NOT ENOUGH ON ITS OWN. Measured: two of the four accepted
      # `--zzz-not-a-flag` and exited 0, so `--self-test` exiting 0 proved nothing about whether
      # the flag was ever recognised. Both argument surfaces are fixed in the same PR; the gate
      # runs the known-negative on every subject on every run so it cannot silently return.
      - name: subject controls (scripts/)
        run: ./scripts/gate-selftests.sh

      # ⛔ POPULATION B — the 29 tools/ instruments exposing `--self-test`, invoked by NOTHING
      # until now (#398, the open half of #372). ⚠ EXPECTED RED, and that is the point: the
      # census names 23 of 46 subjects whose controls cannot be shown to run, each with its
      # cause. A born-red control is a FINDING; excluding the subject converts a broken control
      # into an ABSENT one, and #372 measured what absent controls cost.
      #
      # ⇒ THREE GUARDS LAND BEFORE THIS STEP, IN THIS ORDER, and the middle one is why CI reds
      # rather than HANGS:
      #   1. refuse-unknown-flag, using DEV3's differ-test — does the garbage run DIFFER from the
      #      `--self-test` run? Six subjects absorb the flag entirely; "did it exit nonzero" is
      #      false here because instruments exit nonzero FOR THEIR OWN FINDINGS.
      #   2. PER-SUBJECT TIMEOUT — REFUSE 10s, SELF-TEST 60s. Measured: index-watch's own control
      #      clones a repository and takes ~25s, the slowest by far. A subject that never returns
      #      is reported TIMED OUT AND NAMED, never folded into "the suite failed".
      #   3. tests excluded, declarations checked, both counted and named.
      # ⚠ THE REPRODUCTION COMMAND IS NOT THE SCRIPT NAME. `./scripts/gate-selftests.sh` bare
      # runs `scripts/` and reports 4 subjects; THIS step sets SUBJ_DIR and runs 48. Someone
      # spent three passes comparing the bare form's output to this step's CI result before
      # noticing. To reproduce this step exactly:
      #
      #     SUBJ_DIR=tools SUBJ_BASELINE=23 ./scripts/gate-selftests.sh     (~3 minutes)
      #
      # ⛔ SUBJ_BASELINE IS A RECORDED DEBT, NOT AN EXEMPTION, and the difference is that it
      # CANNOT GROW. 24 of these controls establish nothing today; blocking every PR for nine
      # panes until 24 subjects are repaired is not viable, and going green over them is the
      # defect this gate exists against. ⇒ The run passes at or below the recorded number and
      # REDS the moment it rises. Every non-passing subject is still NAMED on every run.
      # ⚠ Lower it when you repair one — a stated number that is no longer true is the
      # stale-calibration defect this repository has filed three times.
      - name: subject controls (tools/)
        env:
          SUBJ_DIR: tools
          SUBJ_BASELINE: "23"
        run: ./scripts/gate-selftests.sh

  fleet-dependent:
    name: fleet-dependent suites (reported, NOT gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⛔ READ A FAILURE HERE AS "CI HAS NO FLEET", NOT AS A BROKEN TOOL — and read a PASS
      # as nothing at all. These assert on a live ~/.claude/projects corpus, which a runner
      # does not have. They are run so their status is VISIBLE rather than assumed; the
      # correct fix is to make them hermetic with fixtures. ⚠ THAT IS NOT TRACKED ANYWHERE
      # AS THIS IS WRITTEN — saying "tracked separately" would be a claim with no referent,
      # which is the defect `tools/named-referent-check.py` exists to find. It is stated
      # here as an open, unowned gap so the sentence is true.
      - name: fleet-dependent suites
        run: |
          # ⇒ A REASON PER SUITE, read from the suite itself. The five reasons used to live
          # in a `case` in this file; a blanket sentence before that said "expected without
          # a fleet corpus" for a suite that then PASSED, and for two whose dependency is
          # the NETWORK. A guard that explains every failure with one sentence has stopped
          # distinguishing — so the reason travels with the thing it describes.
          ran=0
          for f in tools/test_*.py; do
            why=$(sed -n 's/^# SUITE-DEPENDS: //p' "$f" | head -1)
            [ -z "$why" ] && continue
            ran=$((ran+1)); echo "── $(basename "$f" .py)"
            python3 "$f" && echo "  ok" || echo "  ⚠ failed — $why"
          done
          echo
          if [ "$ran" -eq 0 ]; then
            echo "⛔ ESTABLISHED NOTHING — no suite declares a dependency. Either none does,"
            echo "   or the marker moved. Both print this line; neither is a pass."
          fi
          echo "⛔ This job is continue-on-error. Its green is NOT evidence."

  # ⛔ ADVISORY, AND DELIBERATELY NOT `continue-on-error`. The sibling job above uses it,
  # and for that job it is right — its failures mean "CI has no fleet". Here a finding
  # means a PR would REMOVE content it did not add, and `continue-on-error` renders that
  # as a warning annotation: a detector firing into a stream nobody classifies (#397).
  #
  # ⇒ So this job goes RED on a finding and is NOT in the required-contexts list, which
  # is the whole of "advisory": visible, and blocking nothing. ⛔ Adding it to that list
  # is branch protection and operator-only (docs/MERGE-AUTHORITY.md rule 2). Nothing here
  # touches it.
  #
  # ⚠ What this CANNOT check: who may merge. A runner has no holder session and cannot
  # have one — the holder is a running pane. `--shape-only` omits leg 0 and SAYS SO on
  # every run; it establishes nothing about authority. That half stays merge-time.
  pr-shape:
    name: PR shape (advisory, NOT gating)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # ⛔ three-dot needs history; a shallow clone reads as empty
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⇒ #510 leg 1: "a check exists — CI STEP or merge-time — that refuses a PR whose
      # diff against main removes content the PR did not add." merge-time landed first;
      # this is the other half, so the #572 class is caught when the PR opens rather than
      # when someone happens to run the guard by hand.
      - name: revert-shape and PR hygiene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --quiet || true
          python3 tools/merge-guard.py --shape-only --pr ${{ github.event.pull_request.number }}
