# ⛔ THIS REPOSITORY HAD NO CI AT ALL UNTIL THIS FILE.
#
# Measured 2026-08-20: `gh run list` returned nothing — zero workflow runs, ever. Every
# "all checks green" on every pull request has been **CodeRabbit + Socket Security**, a
# review bot and a dependency scanner. Neither runs a test. So 23 instruments and 19 test
# suites had never executed in CI once, and every PR merged on a green board was merged
# with zero test execution, including six of mine on the day this was written.
#
# ★ That is the defect this repository's own tools were built to find, in this repository:
#   #1267 a convention naming an enforcement path that does not exist
#   #1268 the cluster-spec guard, in-tree and wired into no workflow
#   #1269 "a gate that never refuses looks identical to one that does not exist"
#
# ⚠ THE SPLIT BELOW IS LOAD-BEARING, NOT TIDINESS. Some suites pass on a developer machine
# and FAIL on a runner, because they assert on output that only exists when a real corpus
# is present — "names its scope", "prints project dir count". The tools are right; those
# tests conflated *the tool works* with *this machine has a fleet*. Gating on all of them
# would ship a born-red guard: exactly the finding in #1268.
#
# ⛔ AND THE FIRST VERSION OF THIS FILE GOT THE SPLIT WRONG, MEASURED BY ITS OWN FIRST RUN.
# It said "7 of 19 fail on a runner", derived from re-running under an empty HOME. Run
# 32345860216 reported **6**: `test_grant_check` PASSED. Its local failure was
# `git fetch origin` finding no credentials — and a runner with actions/checkout HAS them.
#
# ⇒ An empty HOME is a proxy for a runner, and it conflates TWO causes: no fleet corpus
# and no network. One of the seven was network. **A real number attached to the wrong
# population**, the defect this repository has catalogued all week, committed in the
# classification of the fix for it. The counts below are now from the CI run, not the proxy.
#
# ★ THREE OF THE SEVEN ARE NOW GATED, by giving them a fixture instead of the developer's
# corpus (`tools/test_corpus_fixture.py`). Their assertions were about OUTPUT SHAPE all
# along; reading the live corpus meant they passed according to what this machine happened
# to hold, which is a green tick over "a working set is not a sample".

name: tools

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hermetic:
    name: hermetic suites (gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⇒ GLOBBED, and each suite DECLARES its own dependency. The literal list this
      # replaces was the single largest source of merge conflicts in this repository:
      # measured 2026-08-20 over the open PRs, 11 of 21 pairs conflicted and
      # `.github/workflows/tools.yml` caused 11 of 11 — every PR that adds a tool edited
      # the same two lines. That is "enforce over the POPULATION, not a literal list",
      # which this repo already had as a rule and not as a practice.
      #
      # ⛔ The old comment's objection was real and is answered, not ignored: a glob would
      # silently absorb a machine-dependent suite and red the gate for a non-defect. So a
      # suite that needs a fleet, a network or a live registry says so IN ITS OWN FILE:
      #     # SUITE-DEPENDS: <the specific reason>
      # A suite declaring nothing is HERMETIC AND GATING. That default is fail-closed in
      # the right direction — the old arrangement's cost was a new suite silently UNGATED
      # until someone remembered to list it, and silence is the worse failure. A
      # mis-defaulted suite fails loudly once and is fixed by one line in the author's own
      # file, touching nothing anyone else edits.
      - name: hermetic test suites
        run: |
          set -uo pipefail
          fail=0; ran=0
          for f in tools/test_*.py; do
            grep -q "^# SUITE-DEPENDS:" "$f" && continue
            ran=$((ran+1)); echo "── $(basename "$f" .py)"
            python3 "$f" || { echo "  ⛔ $(basename "$f") FAILED"; fail=1; }
          done
          # ⛔ A glob that matches nothing runs zero suites and exits 0. "All green" and
          # "the loop never executed" are the same output, so the count is the discriminator.
          if [ "$ran" -eq 0 ]; then
            echo "⛔ ESTABLISHED NOTHING — zero hermetic suites matched. Not a pass."
            exit 1
          fi
          echo "ran $ran hermetic suite(s)"
          exit $fail

      - name: repo scripts
        run: |
          set -euo pipefail
          for s in scripts/*.py ; do
            echo "── $s"
            python3 "$s"
          done

      # ⚠ A suite that exists and is listed nowhere is the defect this file is about,
      # committed inside the fix for it. This step names them; it does not fail the build,
      # because a new suite arriving is not itself a regression.
      - name: unlisted suites (report only)
        if: always()
        run: |
          listed="test_ci_log_clean test_corpus_fixture test_daintree_control
            test_discriminates test_doctrine_watch test_exists_anywhere test_fleet_context
            test_fleet_identity
            test_fleet_identity_exact test_fleet_state test_gh_complete test_issue_coverage
            test_marker_reachability test_memory_index_check
            test_named_referent_check test_pane_binding test_pipe_exit_scan
            test_pointer_verified test_pretooluse_guard test_transition_report
            test_use_not_mention test_wake_yield test_prompt_delivery test_pretooluse_guard test_transition_report
            test_use_not_mention test_wake_yield
            test_prompt_delivery test_pretooluse_guard test_transition_report test_wake_yield
            test_pretooluse_guard test_text_provenance test_transition_report test_wake_yield
            test_bootstrap_audit test_grant_check test_reference_check
            test_runmarker test_stranded_branches"
          # ⛔ COLLAPSE THE NEWLINES FIRST. The list above is written multi-line for
          # readability, so a name at a line end is followed by "\n  ", not " ", and a
          # `case " $listed " in *" $n "*` match misses it. Measured before this fix: it
          # flagged 6 of 19 suites that WERE listed — a guard crying wolf on a third of its
          # population, in the very file arguing that such a guard gets routed around.
          listed=$(echo $listed | tr -s "[:space:]" " ")
          missing=0
          for f in tools/test_*.py; do
            n=$(basename "$f" .py)
            case " $listed " in
              *" $n "*) ;;
              *) echo "⚠ UNLISTED, therefore UNRUN: $n"; missing=1 ;;
            esac
          done
          # ⚠ Only claim completeness when it holds. Printing the reassurance
          # unconditionally, after the warnings, is how a skimmed log reads as clean.
          [ "$missing" -eq 0 ] && echo "✓ every suite in tools/ is accounted for"

  fleet-dependent:
    name: fleet-dependent suites (reported, NOT gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⛔ READ A FAILURE HERE AS "CI HAS NO FLEET", NOT AS A BROKEN TOOL — and read a PASS
      # as nothing at all. These assert on a live ~/.claude/projects corpus, which a runner
      # does not have. They are run so their status is VISIBLE rather than assumed; the
      # correct fix is to make them hermetic with fixtures. ⚠ THAT IS NOT TRACKED ANYWHERE
      # AS THIS IS WRITTEN — saying "tracked separately" would be a claim with no referent,
      # which is the defect `tools/named-referent-check.py` exists to find. It is stated
      # here as an open, unowned gap so the sentence is true.
      - name: fleet-dependent suites
        run: |
          # ⇒ A REASON PER SUITE, read from the suite itself. The five reasons used to live
          # in a `case` in this file; a blanket sentence before that said "expected without
          # a fleet corpus" for a suite that then PASSED, and for two whose dependency is
          # the NETWORK. A guard that explains every failure with one sentence has stopped
          # distinguishing — so the reason travels with the thing it describes.
          ran=0
          for f in tools/test_*.py; do
            why=$(sed -n 's/^# SUITE-DEPENDS: //p' "$f" | head -1)
            [ -z "$why" ] && continue
            ran=$((ran+1)); echo "── $(basename "$f" .py)"
            python3 "$f" && echo "  ok" || echo "  ⚠ failed — $why"
          done
          echo
          if [ "$ran" -eq 0 ]; then
            echo "⛔ ESTABLISHED NOTHING — no suite declares a dependency. Either none does,"
            echo "   or the marker moved. Both print this line; neither is a pass."
          fi
          echo "⛔ This job is continue-on-error. Its green is NOT evidence.""
